name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Check the tag matches the packaged version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(uv run --locked python -c "import parisim; print(parisim.__version__)")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match parisim.__version__ ($PKG)"
            exit 1
          fi

      - name: Run tests
        run: uv run --locked pytest -q

      - name: Build sdist and wheel
        run: uv build

      - name: Validate metadata
        run: uvx twine check --strict dist/*

      - name: Extract release notes
        shell: python
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          import os
          import re

          tag = os.environ.get("GITHUB_REF_NAME", "")
          version = tag.lstrip("v")
          changelog_file = "CHANGELOG.md"
          output_file = "RELEASE_NOTES.md"

          if not os.path.exists(changelog_file):
              print(f"Error: {changelog_file} not found")
              with open(output_file, "w") as f:
                  f.write(f"Release {tag}")
              raise SystemExit(0)

          with open(changelog_file, encoding="utf-8") as f:
              lines = f.readlines()

          in_section = False
          content = []

          # Matches "## [0.1.0]" or "## 0.1.0"
          header_pattern = re.compile(
              rf"^##\s+(\[{re.escape(version)}\]|{re.escape(version)})"
          )
          next_header_pattern = re.compile(r"^##\s+")

          for line in lines:
              if in_section:
                  if next_header_pattern.match(line):
                      break
                  content.append(line)
              elif header_pattern.match(line):
                  in_section = True

          release_notes = "".join(content).strip()

          if not release_notes:
              print(f"Warning: No content found for {version}")
              release_notes = f"Release {tag}"

          with open(output_file, "w", encoding="utf-8") as f:
              f.write(release_notes)

          print(f"Extracted release notes for {version}")

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: RELEASE_NOTES.md

  # Requires a PyPI Trusted Publisher for this repo + a `pypi` environment.
  # See https://docs.pypi.org/trusted-publishers/
  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/parisim
    permissions:
      id-token: write   # mandatory for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@v8
        with:
          name: release-notes

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false

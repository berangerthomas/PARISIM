[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parisim"
dynamic = ["version"]
description = "Compare strings with many similarity methods at once, from typos to meaning"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Béranger Thomas", email = "beranger.thomas@proton.me" }]
keywords = [
    "string-similarity",
    "fuzzy-matching",
    "record-linkage",
    "deduplication",
    "levenshtein",
    "jaro-winkler",
    "phonetic",
    "embeddings",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = [
    "jellyfish>=1.0",
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
pandas = ["pandas>=1.5"]
viz = ["matplotlib>=3.10"]
embeddings = ["fastembed>=0.7.3", "numpy>=1.23"]
all = ["parisim[pandas,viz,embeddings]"]

[project.urls]
Homepage = "https://github.com/berangerthomas/PARISIM"
Repository = "https://github.com/berangerthomas/PARISIM"
Changelog = "https://github.com/berangerthomas/PARISIM/blob/main/CHANGELOG.md"
Issues = "https://github.com/berangerthomas/PARISIM/issues"

[dependency-groups]
dev = [
    "matplotlib>=3.10",
    "mypy>=1.10",
    "pandas>=2.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "scikit-learn>=1.3", # reference implementation for the TF-IDF parity test
]

[tool.hatch.version]
path = "parisim/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["parisim"]

[tool.hatch.build.targets.sdist]
include = ["parisim", "tests", "examples", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests", "parisim"]
addopts = ["--doctest-modules"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["parisim"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:"]

[tool.mypy]
strict = true
python_version = "3.10"

[[tool.mypy.overrides]]
# Optional dependencies, imported lazily, without bundled type information.
module = ["fastembed", "pandas", "sentence_transformers"]
ignore_missing_imports = true

[tool.ruff]
line-length = 90
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018"] # `obj.attr` inside pytest.raises is the assertion
